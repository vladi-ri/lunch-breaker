<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Lunch Breaker</title>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            text-align: center;
            padding: 1.5rem;
        }
        .card { max-width: 24rem; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #64748b; margin-bottom: 1.5rem; }
        button {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            padding: 0.6rem 1.25rem;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're offline</h1>
        <p>Lunch Breaker can't reach the network right now. Check your connection and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
