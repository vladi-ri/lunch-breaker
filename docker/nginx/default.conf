server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Lets the service worker at /build/sw.js control the whole origin ("/")
    # even though it's physically served from /build/ (Vite's build output
    # directory) - see resources/views/layouts/app.blade.php and vite.config.js.
    #
    # sw.js keeps the same filename across every deploy (unlike the hashed
    # asset/workbox files, which bust their own cache automatically), so it
    # must never be cached - by the browser or, critically, by Cloudflare's
    # edge - or a fix pushed to it can silently never reach anyone.
    location = /build/sw.js {
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}
